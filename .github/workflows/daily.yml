name: Ball League daily

# Runs every hour (GitHub may delay scheduled runs by hours): if tomorrow's 06:00 Lisbon video is not uploaded
# yet, render the next match and upload it scheduled for 06:00 (YouTube publishAt). Otherwise it stops in seconds.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ball-league-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Anything to do? (stops here in seconds when the next video is already scheduled)
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("Europe/Lisbon"))
          days = {d.get("publish_date") for d in json.load(open("published.json")).values()}
          today = now.date().isoformat(); tomorrow = (now.date() + datetime.timedelta(days=1)).isoformat()
          print("todo=" + ("false" if today in days and tomorrow in days else "true"))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.todo == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (cairo + Arial-compatible font)
        if: steps.check.outputs.todo == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q libcairo2-dev pkg-config fonts-liberation
      - run: pip install -r requirements.txt
        if: steps.check.outputs.todo == 'true'
      - name: YouTube token (from the encrypted repository secret)
        if: steps.check.outputs.todo == 'true'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: printf '%s' "$YT_TOKEN_JSON" > token.json
      - name: Render and publish
        if: steps.check.outputs.todo == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python cloud_daily.py
      - name: Save the league state in the repository
        if: steps.check.outputs.todo == 'true'
        run: |
          rm -f token.json
          git config user.name "ball-league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add league.json published.json
          git diff --cached --quiet || (git commit -m "Daily match $(date -u +%F)" && git push)
